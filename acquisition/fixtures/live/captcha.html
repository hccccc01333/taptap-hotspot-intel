<!doctype html>
<html lang="zh-CN">
<head>

<title>安全验证（本地合成场景）</title>

<!--
  阻塞约定（见 V4 切片 2 接口冻结 §2/§4）：本页是整页验证码阻塞场景，

<meta name="acq-blocked" content="captcha">
<style>

         border-radius: 16px; box-shadow: 0 10px 32px rgba(28, 36, 48, 0.12); text-align: center; }
  h1 { margin: 0 0 20px; font-size: 40px; }
  main p { margin: 12px 0; font-size: 24px; color: #46536a; }
  button { margin-top: 28px; padding: 16px 44px; font-size: 24px; font-weight: 700;
           color: #ffffff; background: #2f6fed; border: 0; border-radius: 10px;
           font-family: inherit; cursor: pointer; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 24px 48px;
           background: #1c2430; color: #cfd8e3; font-size: 18px; }
</style>
</head>
<body data-acq-blocked="captcha">
<header>
  <nav class="top" aria-label="主导航">

    <p>本页面为本地合成场景，不是真实站点的人机验证页面。</p>
    <button type="button">开始验证</button>
  </section>
</main>
<footer>© 本地合成场景，不是真实站点｜仅用于机制评测</footer>
</body>
</html>
