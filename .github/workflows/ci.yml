name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and contract test dependencies
        run: python -m pip install requests beautifulsoup4 jsonschema fastapi httpx 'networkx>=3.4,<4'
      - name: Validate automatic Agent and public publication contracts
        run: >-
          python -m unittest
          agent_v3.tests.test_delivery21
          agent_v3.tests.test_delivery22
          agent_v3.tests.test_delivery23
          agent_v3.tests.test_delivery24
          agent_v3.tests.test_claim_verifier
          agent_v3.tests.test_claim_fact_set
          agent_v3.tests.test_repo_publication
          webapp.tests.test_auth_local webapp.tests.test_webapp
          agent_v3.tests.test_go20
          agent_v3.tests.test_benchmark
          agent_v3.tests.test_providers18
          agent_v3.tests.test_graph17
          agent_v3.tests.test_runtime16
          agent_v3.tests.test_library15 agent_v3.tests.test_public_site agent_v3.tests.test_automation13
          agent_v3.tests.test_risk_and_comments agent_v3.tests.test_quality
          agent_v3.tests.test_browser_tools agent_v3.tests.test_main_agent
          agent_v3.tests.test_web_research agent_v3.tests.test_deepseek
          agent_v3.tests.test_research_tracking agent_v3.tests.test_public_sources
          agent_v3.tests.test_space_bunny agent_v3.tests.test_delivery
          agent_v3.tests.test_zen agent_v3.tests.test_continuity agent_v3.tests.test_v3
          agent_core.tests.test_core agent_core.tests.test_operations agent_core.tests.test_model
          runtime.tests.test_pipeline_health intelligence.tests.test_creative_delivery
          intelligence.tests.test_llm -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for API regression checks
        run: python -m pip install requests beautifulsoup4 jsonschema fastapi httpx 'networkx>=3.4,<4'

      # Optional LangGraph integration is skipped when its runtime is absent.
      - name: Run unit tests per layer
        run: |
          python -m unittest discover -s semantic/tests -p "test_*.py"
          python -m unittest discover -s trend/tests -p "test_*.py"
          python -m unittest discover -s intelligence/tests -p "test_*.py"
          python -m unittest discover -s memory/tests -p "test_*.py"
          python -m unittest discover -s execution/tests -p "test_*.py"
          python -m unittest discover -s runtime/tests -p "test_*.py"
          python -m unittest discover -s games/tests -p "test_*.py"

      - name: Guard current publication index
        run: python scripts/public_repo_guard.py
